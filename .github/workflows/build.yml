name: Build Release Binaries

# Builds the one-file binaries — a Windows x86-64 .exe (PyInstaller cannot
# cross-compile, hence one job per OS) and a Linux x86-64 binary — and
# publishes both as GitHub Release assets. Both install the SAME locked
# environment (uv sync ← pyproject + uv.lock), so a release ships exactly the
# dependency set the test suite ran against.
# Triggers on tag pushes like v1.0.0 (a -rc suffix marks the release as a
# prerelease); also runnable manually (artifacts only, no release).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to create the Release and upload the assets

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history + tags → git describe works for manual builds

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The git tag is the single source of truth for the version: stamp it into
      # agilent_turbo/__init__.py's placeholder before freezing (no manual bump).
      # Manual (workflow_dispatch) builds stamp `git describe` instead.
      - name: Stamp version from the git tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(git describe --tags --always --dirty)"; V="${V#v}"
          fi
          grep -q '__version__ = "0.0.0+dev"' agilent_turbo/__init__.py
          sed -i "s/__version__ = \"0.0.0+dev\"/__version__ = \"$V\"/" agilent_turbo/__init__.py
          grep '^__version__' agilent_turbo/__init__.py
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Install locked environment (+ PyInstaller)
        run: uv sync --group package

      - name: Build EXE
        shell: bash
        run: |
          uv run pyinstaller packaging/agilent_turbo_reader.spec
          mv dist/AgilentTurboReader.exe "dist/AgilentTurboReader-${VERSION}-windows-x64.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgilentTurboReader-${{ env.VERSION }}-windows-x64
          path: dist/AgilentTurboReader-*.exe

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AgilentTurboReader-*.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}

  build-linux:
    # Built on the OLDEST supported LTS: a PyInstaller binary inherits the
    # builder's glibc floor, so 22.04 keeps it runnable on 22.04-and-newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qt runtime libs (analysis imports Qt; the smoke needs a desktop's X stack)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
                                  libdbus-1-3 xvfb libglx-mesa0 libpulse0 \
                                  libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
                                  libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
                                  libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
                                  libxcb-xkb1 libxcb-xinerama0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Stamp version from the git tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(git describe --tags --always --dirty)"; V="${V#v}"
          fi
          grep -q '__version__ = "0.0.0+dev"' agilent_turbo/__init__.py
          sed -i "s/__version__ = \"0.0.0+dev\"/__version__ = \"$V\"/" agilent_turbo/__init__.py
          grep '^__version__' agilent_turbo/__init__.py
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Install locked environment (+ PyInstaller)
        run: uv sync --group package

      - name: Build binary
        env:
          QT_QPA_PLATFORM: offscreen   # analysis children import Qt-touching modules
        run: |
          uv run pyinstaller packaging/agilent_turbo_reader.spec
          mv dist/AgilentTurboReader "dist/AgilentTurboReader-${VERSION}-linux-x64"

      - name: Smoke-run the frozen binary (real xcb under Xvfb)
        # Boot on a REAL X server (offscreen never touches GLX), require the
        # process to be alive after 15 s (one-file unpack + full startup incl.
        # the serial port enumeration), then shut it down.
        run: |
          xvfb-run -a env HOME=/tmp/atr-smoke ./dist/AgilentTurboReader-*-linux-x64 &
          APP=$!
          sleep 15
          kill -0 "$APP"
          kill "$APP"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgilentTurboReader-${{ env.VERSION }}-linux-x64
          path: dist/AgilentTurboReader-*-linux-x64

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AgilentTurboReader-*-linux-x64
          prerelease: ${{ contains(github.ref_name, '-rc') }}
