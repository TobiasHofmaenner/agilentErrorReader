name: Tests

# Runs the test suite on every push / PR so a protocol or UI-wiring regression
# can't reach a release binary silently. All jobs install the SAME locked
# environment (uv sync ← pyproject + uv.lock).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  core:
    # The fast gate: protocol framing (manual examples) + scanner/reader against
    # the pty simulator. Qt-free, but the locked env includes PySide6 so its
    # native libs must be present for collection.
    name: protocol + simulator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --group dev
      - name: Run protocol + simulator suite
        run: uv run pytest -m "not ui" -ra

  core-windows:
    # Same suite on Windows (the pty simulator tests skip themselves there); it
    # guards the protocol layer and that every module still imports on Windows.
    name: protocol (Windows)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --group dev
      - name: Run protocol suite
        run: uv run pytest -m "not ui" -ra

  ui:
    # PySide6 offscreen smoke: build the main window, scan a simulated controller,
    # check status / error / table wiring and the Markdown export.
    name: UI smoke (offscreen Qt)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --group dev
      - name: Run UI smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -m ui -ra
